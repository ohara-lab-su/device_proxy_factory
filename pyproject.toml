[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "device-proxy-factory"
version = "0.2.0"
description = "Transport-independent device client factory registry"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }
authors = [{ name = "Ohara Lab" }]
dependencies = ["typing_extensions>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
device_proxy_factory = ["*.pyi", "py.typed"]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/device_proxy_factory/"
Documentation = "https://ohara-lab-su.github.io/device_proxy_factory/"
Repository = "https://github.com/ohara-lab-su/device_proxy_factory"
Issues = "https://github.com/ohara-lab-su/device_proxy_factory/issues"
