[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "device-proxy-factory"
version = "0.0.0"
description = "Transport-independent device client factory registry"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }
authors = [{ name = "Ohara Lab" }]
dependencies = ["typing_extensions>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
device_proxy_factory = ["*.pyi", "py.typed"]
